version: '3.8'

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_dev
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: ${DB_HOST:-host.docker.internal}
      PMA_PORT: ${DB_PORT:-3307}
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      UPLOAD_LIMIT: ${PHP_UPLOAD_MAX_FILESIZE:-2048M}
      MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-2048M}
      MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
